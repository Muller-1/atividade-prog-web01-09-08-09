<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Agendamento de Salas</title>

  <!-- Bootstrap: deixa a página com aparência pronta (tabela, botões, cards, modal) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Nosso próprio CSS -->
  <link href="style.css" rel="stylesheet" />
</head>

<body>

  <!-- "container" centraliza o conteúdo e limita a largura da página -->
  <div class="container">

    <h1>Sistema de Agendamento de Salas</h1>

    <!-- ==================== MÉTRICAS ==================== -->
    <section>
      <h2>Métricas</h2>

      <!-- Os números devem ser preenchidos pelo JS, calculados a partir da lista ativa/filtrada -->
      <!-- "row" cria uma linha; cada "col-md-3" ocupa 1/4 dela em telas médias ou maiores -->
      <div class="row">
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Total de Reservas: <span id="metricaTotal"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Manhã: <span id="metricaManha"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Tarde: <span id="metricaTarde"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Noite: <span id="metricaNoite"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== FILTROS ==================== -->
    <section>
      <h2>Filtros</h2>

      <form id="formFiltros" class="row">
        <div class="col-md-3">
          <label for="filtroSolicitante" class="form-label">Solicitante</label>
          <input type="text" id="filtroSolicitante" class="form-control" />
        </div>

        <div class="col-md-3">
          <label for="filtroData" class="form-label">Data</label>
          <input type="date" id="filtroData" class="form-control" />
        </div>

        <div class="col-md-3">
          <label for="filtroBloco" class="form-label">Bloco</label>
          <select id="filtroBloco" class="form-select">
            <option value="">Todos os blocos</option>
            <!-- As <option> de bloco devem ser geradas no JS a partir de infraestrutura (dados.js) -->
          </select>
        </div>

        <div class="col-md-3">
          <label for="filtroSala" class="form-label">Sala</label>
          <select id="filtroSala" class="form-select">
            <option value="">Todas as salas</option>
            <!-- As <option> de sala devem ser geradas no JS a partir de infraestrutura (dados.js) -->
          </select>
        </div>

        <div class="col-12">
          <button type="button" id="btnLimparFiltros" class="btn btn-secondary">Limpar Filtros</button>
        </div>
      </form>
    </section>

    <!-- ==================== LISTAGEM DE RESERVAS ==================== -->
    <section>
      <h2>Reservas</h2>

      <!-- O JS deve abrir a modal quando este botão for clicado -->
      <button type="button" id="btnNovoAgendamento" class="btn btn-primary">Novo Agendamento</button>

      <!-- O JS deve mostrar este alerta quando a lista estiver vazia e escondê-lo quando houver reservas -->
      <div id="alertaVazio" class="alert alert-warning" hidden>
        Ainda não foram realizadas reservas de salas.
      </div>

      <table id="tabelaReservas" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>#</th>
            <th>Solicitante</th>
            <th>Bloco</th>
            <th>Sala</th>
            <th>Data</th>
            <th>Turno</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaReservas">
          <!-- As <tr> devem ser geradas no JS (renderizarTabela) a partir da lista de agendamentos -->
        </tbody>
      </table>
    </section>

  </div>

  <!-- ==================== MODAL: NOVO AGENDAMENTO ==================== -->
  <!-- Nasce escondida. Quem abre e fecha é o nosso JS, com: new bootstrap.Modal(elemento) -->
  <!-- As classes modal / modal-dialog / modal-content são exigidas pelo Bootstrap para a modal funcionar -->
  <!-- tabindex="-1" deixa a modal receber o foco do teclado, o que faz a tecla Esc fechá-la -->
  <div class="modal" id="modalNovoAgendamento" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <form id="formNovoAgendamento">

          <div class="modal-header">
            <h2>Novo Agendamento</h2>
          </div>

          <div class="modal-body">

            <!-- O JS deve escrever a mensagem do conflito aqui e mostrar o alerta, sem fechar a modal -->
            <div id="alertaColisao" class="alert alert-danger" hidden>
              <span id="mensagemColisao"></span>
            </div>

            <label for="inputSolicitante" class="form-label">Nome do Solicitante</label>
            <input type="text" id="inputSolicitante" class="form-control" required />

            <label for="selectBloco" class="form-label">Bloco</label>
            <select id="selectBloco" class="form-select" required>
              <option value="">Selecione...</option>
              <!-- As <option> de bloco devem ser geradas no JS a partir de infraestrutura (dados.js) -->
            </select>

            <label for="selectSala" class="form-label">Sala</label>
            <select id="selectSala" class="form-select" required>
              <option value="">Selecione...</option>
              <!-- As <option> de sala devem ser geradas no JS conforme o bloco selecionado (selects dependentes) -->
            </select>

            <label for="inputData" class="form-label">Data da Reserva</label>
            <input type="date" id="inputData" class="form-control" required />

            <label for="selectTurno" class="form-label">Turno</label>
            <select id="selectTurno" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
              <option value="Noite">Noite</option>
            </select>

          </div>

          <div class="modal-footer">
            <!-- O JS deve fechar a modal quando este botão for clicado -->
            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Agendamento</button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS: é ele que sabe abrir e fechar a modal -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Ponto de entrada dos nossos módulos ES6 -->
  <script type="module" src="index.js"></script>

</body>

</html>
