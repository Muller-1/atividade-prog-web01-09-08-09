<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Agendamento de Salas</title>

  <!-- bootstrap, só pra não ter que estilizar botão, card, tabela e modal na mão -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- css nosso, com os ajustes que o bootstrap não cobre -->
  <link href="style.css" rel="stylesheet" />
</head>

<body>

  <!-- container centraliza tudo e limita a largura, senão fica esticado até a borda da tela -->
  <div class="container">

    <h1>Sistema de Agendamento de Salas</h1>

    <!-- métricas -->
    <section>
      <h2>Métricas</h2>

      <!-- row + col-md-3 é o grid do bootstrap, cada card ocupa 1/4 da linha em telas médias pra cima -->
      <div class="row">
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Total de Reservas: <span id="metricaTotal"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Manhã: <span id="metricaManha"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Tarde: <span id="metricaTarde"></span></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card">
            <div class="card-body">Turno da Noite: <span id="metricaNoite"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- filtros -->
    <section>
      <h2>Filtros</h2>

      <form id="formFiltros" class="row">
        <div class="col-md-3">
          <label for="filtroSolicitante" class="form-label">Solicitante</label>
          <input type="text" id="filtroSolicitante" class="form-control" />
        </div>

        <div class="col-md-3">
          <label for="filtroData" class="form-label">Data</label>
          <input type="date" id="filtroData" class="form-control" />
        </div>

        <div class="col-md-3">
          <label for="filtroBloco" class="form-label">Bloco</label>
          <select id="filtroBloco" class="form-select">
            <option value="">Todos os blocos</option>
          </select>
        </div>

        <div class="col-md-3">
          <label for="filtroSala" class="form-label">Sala</label>
          <select id="filtroSala" class="form-select">
            <option value="">Todas as salas</option>
          </select>
        </div>

        <div class="col-12">
          <button type="button" id="btnLimparFiltros" class="btn btn-secondary">Limpar Filtros</button>
        </div>
      </form>
    </section>

    <!-- listagem das reservas -->
    <section>
      <h2>Reservas</h2>

      <button type="button" id="btnNovoAgendamento" class="btn btn-primary">Novo Agendamento</button>

      <div id="alertaVazio" class="alert alert-warning" hidden>
        Ainda não foram realizadas reservas de salas.
      </div>

      <table id="tabelaReservas" class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>#</th>
            <th>Solicitante</th>
            <th>Bloco</th>
            <th>Sala</th>
            <th>Data</th>
            <th>Turno</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaReservas"></tbody>
      </table>
    </section>

  </div>

  <!-- modal de novo agendamento -->
  <!-- começa escondida, quem abre e fecha é o js (new bootstrap.Modal) -->
  <!-- as classes modal / modal-dialog / modal-content são obrigatórias pro bootstrap reconhecer isso como modal -->
  <!-- tabindex="-1" faz a modal aceitar foco de teclado, e é isso que deixa o Esc fechar ela -->
  <div class="modal" id="modalNovoAgendamento" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <form id="formNovoAgendamento">

          <div class="modal-header">
            <h2>Novo Agendamento</h2>
          </div>

          <div class="modal-body">

            <div id="alertaColisao" class="alert alert-danger" hidden>
              <span id="mensagemColisao"></span>
            </div>

            <label for="inputSolicitante" class="form-label">Nome do Solicitante</label>
            <input type="text" id="inputSolicitante" class="form-control" required />

            <label for="selectBloco" class="form-label">Bloco</label>
            <select id="selectBloco" class="form-select" required>
              <option value="">Selecione...</option>
            </select>

            <label for="selectSala" class="form-label">Sala</label>
            <select id="selectSala" class="form-select" required>
              <option value="">Selecione...</option>
            </select>

            <label for="inputData" class="form-label">Data da Reserva</label>
            <input type="date" id="inputData" class="form-control" required />

            <label for="selectTurno" class="form-label">Turno</label>
            <select id="selectTurno" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
              <option value="Noite">Noite</option>
            </select>

          </div>

          <div class="modal-footer">
            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Agendamento</button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- JS do bootstrap, é dele que vem o bootstrap.Modal usado lá no index.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- nosso js começa por aqui -->
  <script type="module" src="index.js"></script>

</body>

</html>
